<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Marvin Guerra</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/llama-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/style.css">
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .lost-strip {
      height: 24px;
      background-image: var(--tocapu-ink);
      opacity: 0.85;
    }
    .lost {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px 64px;
      position: relative;
      overflow: hidden;
    }
    .lost-spiral {
      position: absolute;
      width: 360px;
      right: -90px;
      top: 40px;
      color: var(--clay);
      opacity: 0.08;
      pointer-events: none;
    }
    .lost-art {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 6px;
      border: 1px solid var(--hairline-12);
      background: var(--card);
      box-shadow: 10px 10px 0 var(--ochre);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .lost-art img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .lost-art img.active { opacity: 1; }
    .lost-art .lost-fallback {
      object-fit: contain;
      padding: 40px;
    }
    .lost-dots {
      display: flex;
      gap: 6px;
      margin: 18px 0 28px;
    }
    .lost-dots button {
      width: 8px;
      height: 8px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .lost-dots button.active { background: var(--clay); border-color: var(--clay); }
    .lost-code {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(4.5rem, 14vw, 7.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .lost-code em { color: var(--clay); font-style: italic; }
    .lost-kicker {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 18px 0 10px;
    }
    .lost-title {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 400;
      margin: 0 0 12px;
    }
    .lost-message {
      max-width: 440px;
      color: var(--muted-2);
      font-size: 17px;
      line-height: 1.6;
      margin: 0 0 32px;
    }
    .lost-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 24px;
      align-items: center;
    }
    .lost-home {
      display: inline-block;
      background: var(--ink);
      color: var(--bg);
      text-decoration: none;
      border-radius: 100px;
      padding: 14px 30px;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.04em;
      transition: background 0.15s;
    }
    .lost-home:hover { background: var(--clay); }
    .lost-link {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ink-80);
      text-decoration: none;
      border-bottom: 1px solid var(--hairline-12);
      padding-bottom: 2px;
    }
    .lost-link:hover { color: var(--clay); border-bottom-color: var(--clay); }
    @media (max-width: 640px) {
      .lost-art { width: 210px; height: 210px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lost-art img { transition: none; }
    }
  </style>
</head>
<body>
  <div class="lost-strip" aria-hidden="true"></div>

  <main class="lost">
    <svg class="lost-spiral" viewBox="-28 -28 56 54" aria-hidden="true">
      <path d="M0 0 a4 4 0 0 1 8 0 a8 8 0 0 1 -16 0 a12 12 0 0 1 24 0 a16 16 0 0 1 -32 0 a20 20 0 0 1 40 0 a24 24 0 0 1 -48 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>

    <!-- GIFs come from Tenor's embed links (the licensed way to show them).
         If Tenor is down or blocks them, the site's own llama shows instead. -->
    <div class="lost-art" id="lost-art">
      <img class="lost-fallback" src="/assets/img/llama-avatar.png" alt="Marvin's llama mascot">
      <img class="lost-gif" src="https://media1.tenor.com/m/Qr0iBlPVDgUAAAAd/emperors-new-groove-kuzco.gif" alt="Sad llama in the rain">
      <img class="lost-gif" src="https://media1.tenor.com/m/4H3sSEendXsAAAAd/yes-llama.gif" alt="Whining llama">
      <img class="lost-gif" src="https://media1.tenor.com/m/_mYFry21FRYAAAAd/angry.gif" alt="Angry llama">
      <img class="lost-gif" src="https://media1.tenor.com/m/9j6fuQEjwZcAAAAC/thaonema-llama.gif" alt="Crying llama">
    </div>
    <div class="lost-dots" id="lost-dots" role="group" aria-label="Choose a llama" hidden></div>

    <h1 class="lost-code">4<em>0</em>4</h1>
    <p class="lost-kicker">Page not found</p>
    <p class="lost-title">This llama has lost its way</p>
    <p class="lost-message">Looks like you wandered off the trail. Even the best llamas take a wrong turn sometimes. Let's get you back to familiar pastures.</p>

    <div class="lost-actions">
      <a href="/" class="lost-home">Take me home →</a>
      <a href="/#speaking" class="lost-link">Speaking</a>
      <a href="/#contact" class="lost-link">Get in touch</a>
    </div>
  </main>

  <script>
    (function () {
      const fallback = document.querySelector('.lost-fallback');
      const dotsWrap = document.getElementById('lost-dots');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let gifs = [];
      let current = 0;
      let timer = null;

      function show(i) {
        gifs.forEach((g, n) => g.classList.toggle('active', n === i));
        dotsWrap.querySelectorAll('button').forEach((d, n) => {
          d.classList.toggle('active', n === i);
          d.setAttribute('aria-pressed', n === i ? 'true' : 'false');
        });
        current = i;
      }

      function start() {
        clearInterval(timer);
        if (!reduceMotion && gifs.length > 1) {
          timer = setInterval(() => show((current + 1) % gifs.length), 4000);
        }
      }

      function render() {
        dotsWrap.innerHTML = '';
        if (!gifs.length) {
          fallback.classList.add('active');
          dotsWrap.hidden = true;
          clearInterval(timer);
          return;
        }
        fallback.classList.remove('active');
        gifs.forEach((g, n) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('aria-label', g.alt);
          b.addEventListener('click', () => { show(n); start(); });
          dotsWrap.appendChild(b);
        });
        dotsWrap.hidden = gifs.length < 2;
        show(Math.min(current, gifs.length - 1));
        start();
      }

      // Keep only the GIFs that actually load; show the mascot until one does.
      fallback.classList.add('active');
      document.querySelectorAll('.lost-gif').forEach(img => {
        const ok = () => {
          if (!gifs.includes(img)) {
            gifs = Array.from(document.querySelectorAll('.lost-gif')).filter(g => g === img || gifs.includes(g));
            render();
          }
        };
        const bad = () => { img.remove(); gifs = gifs.filter(g => g !== img); render(); };
        if (img.complete) { img.naturalWidth ? ok() : bad(); }
        else { img.addEventListener('load', ok); img.addEventListener('error', bad); }
      });
    })();
  </script>

</body>
</html>
